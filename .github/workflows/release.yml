name: Build and publish Blender extension repository

on:
  push:
    branches: [main]
    paths:
      - 'jointcraft/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 5.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          mkdir -p blender-bin
          tar -xf blender.tar.xz -C blender-bin --strip-components=1
      - name: Test pin and socket in Blender 5.2
        run: |
          ./blender-bin/blender --background --factory-startup --python-exit-code 1 --python tests/blender_integration.py
      - name: Validate extension manifest
        run: |
          ./blender-bin/blender --background --factory-startup --command extension validate jointcraft
      - name: Build extension package
        run: |
          mkdir -p public
          ./blender-bin/blender --background --factory-startup --command extension build --source-dir jointcraft --output-dir public
      - name: Generate Blender extension repository index
        run: |
          ./blender-bin/blender --background --factory-startup --command extension server-generate --repo-dir public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
